services:
  openclaw-gateway:
    image: openclaw:local
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      NODE_ENV: development
    volumes:
      - openclaw_dev_home:/home/node
      - ./data/config:/home/node/.openclaw/config
      - ./data/workspace:/home/node/.openclaw/workspace
      - ./src:/app/src:cached
      - ./extensions:/app/extensions:cached
      - ./packages:/app/packages:cached
      - ./ui:/app/ui:cached
      - ./skills:/app/skills:cached
    ports:
      - "${OPENCLAW_GATEWAY_PORT}:18789"
      - "${OPENCLAW_BRIDGE_PORT}:18790"
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND}", "--port", "18789", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  openclaw-cli:
    image: openclaw:local
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      NODE_ENV: development
    volumes:
      - openclaw_dev_home:/home/node
      - ./data/config:/home/node/.openclaw/config
      - ./data/workspace:/home/node/.openclaw/workspace
      - ./src:/app/src:cached
      - ./extensions:/app/extensions:cached
      - ./packages:/app/packages:cached
      - ./ui:/app/ui:cached
      - ./skills:/app/skills:cached
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

volumes:
  openclaw_dev_home:
    name: openclaw_dev_home
    driver: local
